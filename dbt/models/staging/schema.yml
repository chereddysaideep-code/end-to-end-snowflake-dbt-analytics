version: 2

models:

  - name: stg_customers
    description: "Cleaned customer records from the raw customer source."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        tests:
          - not_null
          - unique

  - name: stg_products
    description: "Cleaned product records from the raw product source."
    columns:
      - name: product_id
        description: "Unique product identifier."
        tests:
          - not_null
          - unique

  - name: stg_orders
    description: "Cleaned order records from the raw order source."
    columns:
      - name: order_id
        description: "Unique order identifier."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Customer associated with the order."
        tests:
          - not_null

  - name: stg_order_items
    description: "Cleaned order line-item records."
    columns:
      - name: order_item_id
        description: "Unique order item identifier."
        tests:
          - not_null
          - unique
      - name: order_id
        description: "Order associated with the item."
        tests:
          - not_null
      - name: product_id
        description: "Product associated with the item."
        tests:
          - not_null

  - name: fct_order_revenue
    description: "Revenue fact table containing completed orders."
    columns:
      - name: order_id
        description: "Unique completed order identifier."
        tests:
          - not_null
          - unique
      - name: customer_id
        description: "Customer associated with the completed order."
        tests:
          - not_null

  - name: dim_customers
    description: "Customer dimension for analytics."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        tests:
          - not_null
          - unique

  - name: dim_products
    description: "Product dimension for analytics."
    columns:
      - name: product_id
        description: "Unique product identifier."
        tests:
          - not_null
          - unique

  - name: dim_date
    description: "Date dimension for time-based analytics."
    columns:
      - name: date_day
        description: "Calendar date."
        tests:
          - not_null
          - unique
